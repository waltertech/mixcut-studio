name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pillow

      - name: Cache Windows toolchain
        uses: actions/cache@v4
        with:
          path: windows/_tools
          key: mixcut-windows-tools-v1

      - name: Build and smoke-test installer
        run: python windows/build_tools/build.py --verify

      - name: Run test suite
        run: |
          Add-Content $env:GITHUB_PATH (Resolve-Path windows/_tools/ffmpeg-bin)
          $env:PATH = "$(Resolve-Path windows/_tools/ffmpeg-bin);$env:PATH"
          Push-Location windows/src_pkg/mixcut-studio-main
          python -m unittest discover -s tests -q
          Pop-Location

      - name: Package source
        run: python windows/build_tools/make_source_zip.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MixCutStudio-Windows
          path: |
            windows/output/MixCutStudio-*-win64-Setup.exe
            windows/output/MixCutStudio-*-src.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          windows/output/MixCutStudio-*-win64-Setup.exe
          windows/output/MixCutStudio-*-src.zip
          --generate-notes
